# CI for the documentation site.
#
# - Pull requests: strict build (broken links/anchors fail) and DCO sign-off check.
# - Pushes to main: strict build, then deploy to GitHub Pages.
# - "CI result" is the single check required by the branch ruleset (same name in every repo).
#
# Actions are pinned to full commit SHAs (organization policy); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Build site (strict)
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format=%B "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit "$status"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    # Only one deployment at a time; skip runs queued behind the one in progress.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  ci-result:
    name: CI result
    if: always()
    needs: [build, dco]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: All required jobs passed
        run: echo "All required jobs succeeded or were skipped."
