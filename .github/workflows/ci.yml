# CI for the documentation site.
#
# Container-first: the checks are make targets (see Makefile), run two ways:
# - Container (podman): `make check` in the same toolchain image developers use.
# - Native (ubuntu-latest): `make check` with DP_RUNTIME=local; on main it also produces the
#   Pages artifact that the deploy job publishes.
# - Shared tooling: tools/dp-run and tools/container.mk match the canonical copies.
# - DCO: Signed-off-by on every pull-request commit.
# - "CI result" is the single check required by the branch ruleset (same name in every repo).
#
# Actions are pinned to full commit SHAs (organization policy); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run catches toolchain and runner drift even when nothing changes here.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  container:
    name: Container (podman)
    runs-on: ubuntu-latest
    env:
      DP_RUNTIME: podman
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain environment
        run: make dp-info

      - name: make check
        run: make check

  native:
    name: Native (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      DP_RUNTIME: local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: make check
        run: make check

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  shared-tooling:
    name: Shared tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tools/dp-run and tools/container.mk match the canonical copies
        run: |
          status=0
          for file in tools/dp-run tools/container.mk; do
            curl -fsSL "https://raw.githubusercontent.com/dialectic-playground/.github/main/$file" \
              | diff -u - "$file" \
              || { echo "::error::$file differs from the canonical copy in dialectic-playground/.github"; status=1; }
          done
          exit "$status"

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format=%B "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit "$status"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [container, native, shared-tooling]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    # Only one deployment at a time; skip runs queued behind the one in progress.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  ci-result:
    name: CI result
    if: always()
    needs: [container, native, shared-tooling, dco]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      # Matrix jobs report one combined result to `needs`, which can hide a cancelled leg
      # (for example a runner that never started). Check every job of this run attempt.
      - name: Require every job in this run to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS_URL: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
          IGNORED_JOBS: "CI result|Deploy to GitHub Pages"
        run: |
          jobs=$(gh api "$JOBS_URL" --paginate --jq '.jobs[] | "\(.name)\t\(.conclusion)"')
          printf '%s\n' "$jobs"
          bad=$(printf '%s\n' "$jobs" | awk -F '\t' -v ignored="$IGNORED_JOBS" '
            BEGIN { n = split(ignored, list, "|"); for (i = 1; i <= n; i++) skip[list[i]] = 1 }
            $1 in skip { next }
            $1 == "DCO" && $2 == "skipped" { next }
            $2 != "success" { print }')
          if [ -n "$bad" ]; then
            echo "::error::Not every job succeeded:"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "All jobs in this run succeeded."
