# Keeps GitHub Actions (SHA-pinned) and the locked docs toolchain current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      docs-toolchain:
        patterns: ["*"]
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The Python line (3.12) is an organization-wide decision shared with the native CI jobs;
    # Dependabot keeps the digest current but never moves to a new Python minor or major.
    ignore:
      - dependency-name: "astral-sh/uv"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
